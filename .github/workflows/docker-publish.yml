name: Build & publish Docker image

# Construit l'image serveur multi-arch (amd64 + arm64) et la publie sur
# ghcr.io (P2.2, PLAN-PUBLICATION.md).
#
# Déclencheurs :
#   • push d'un tag `vX.Y.Z`  → image taggée `X.Y.Z`, `X.Y` (+ `latest` si non
#     pré-release) — le canal de release officiel.
#   • workflow_dispatch        → build manuel taggé du nom de la branche (test).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Un seul build par ref à la fois. Un nouveau dispatch remplace celui en cours ;
# un build de tag n'est jamais annulé (canal de release officiel).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Aucune image n'est publiée sans une suite de tests verte sur le même commit.
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tous les tags v*, pour décider de :latest

      # `latest` ne bouge que pour le plus haut tag v* hors pré-release : un
      # correctif publié sur une ancienne branche ne doit jamais le reculer.
      - name: Version la plus haute ? (pour :latest)
        id: latest
        run: |
          highest="$(git tag -l 'v*' --sort=-v:refname | grep -v -- - | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (émulation pour le build arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels (docker/metadata-action)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<court> : tag immuable de chaque build, pour revenir en arrière
          # sur une image précise (les tags de version ou de branche bougent).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_highest == 'true' }}
          flavor: |
            latest=false

      # Version affichée dans l'interface (Réglages → Serveur). `metadata-action`
      # donne la version sémantique pour un tag et le nom de branche pour un
      # dispatch ; le SHA court la complète pour que deux builds successifs de
      # `main` ne se confondent pas — sans quoi le bouton « Mettre à jour » ne
      # permettrait pas de vérifier que la mise à jour a bien eu lieu.
      - name: Version de build
        id: version
        run: echo "value=${{ steps.meta.outputs.version }}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FONTSYNC_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
