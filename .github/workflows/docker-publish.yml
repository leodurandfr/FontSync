name: Build & publish Docker image

# Construit l'image serveur multi-arch (amd64 + arm64) et la publie sur
# ghcr.io (P2.2, PLAN-PUBLICATION.md).
#
# Déclencheurs :
#   • push d'un tag `vX.Y.Z`  → image taggée `X.Y.Z`, `X.Y` (+ `latest` si non
#     pré-release) — le canal de release officiel.
#   • workflow_dispatch        → build manuel taggé du nom de la branche (test).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Un seul build par ref à la fois. Un nouveau dispatch remplace celui en cours ;
# un build de tag n'est jamais annulé (canal de release officiel).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Aucune image n'est publiée sans une suite de tests verte sur le même commit.
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tous les tags v*, pour décider de :latest

      # `latest` ne bouge que pour le plus haut tag v* hors pré-release : un
      # correctif publié sur une ancienne branche ne doit jamais le reculer.
      - name: Version la plus haute ? (pour :latest)
        id: latest
        run: |
          highest="$(git tag -l 'v*' --sort=-v:refname | grep -v -- - | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (émulation pour le build arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels (docker/metadata-action)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<court> : tag immuable de chaque build, pour revenir en arrière
          # sur une image précise (les tags de version ou de branche bougent).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_highest == 'true' }}
          flavor: |
            latest=false

      # Version affichée dans l'interface (Réglages → Serveur). `metadata-action`
      # donne la version sémantique pour un tag et le nom de branche pour un
      # dispatch ; le SHA court la complète pour que deux builds successifs de
      # `main` ne se confondent pas — sans quoi le bouton « Mettre à jour » ne
      # permettrait pas de vérifier que la mise à jour a bien eu lieu.
      - name: Version de build
        id: version
        run: echo "value=${{ steps.meta.outputs.version }}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FONTSYNC_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # Scan de l'image publiée (informatif, non bloquant) : le rapport est joint au
  # run en artefact. Trivy est épinglé par digest. Le blocage se fait en amont,
  # sur les dépendances déclarées (job `audit` de ci.yml).
  image-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trivy (vulnérabilités de l'image)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          mkdir -p scan
          docker run --rm -v "$PWD/scan:/out" \
            aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --scanners vuln --format table --output /out/trivy.txt "$IMAGE"

      - name: Rapport en artefact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: scan/
          if-no-files-found: warn
