name: CI

# Lint + tests du backend et de l'agent, build typé + tests du frontend.
# Lancé à chaque push et pull request, et appelé par docker-publish.yml avant
# toute publication d'image (M-22) : une image ne part jamais si ce workflow échoue.
on:
  push:
  pull_request:
  workflow_call:
  # Audit hebdomadaire des dépendances (lundi 06:00 UTC) : seul le job `audit`
  # tourne ; rien n'est reconstruit ni publié sans geste humain.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dépendances (serveur + outils + agent)
        run: pip install -r requirements-dev.txt -e .

      - name: Lint (ruff)
        run: |
          ruff check backend agent tests
          ruff format --check backend agent tests

      - name: Tests (pytest)
        run: pytest tests/ -q

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Build typé (vue-tsc + vite)
        run: npm run build

      - name: Tests (vitest)
        run: npm test

  # Avis de sécurité connus : bloquant avant toute publication d'image. Une
  # exception n'est admise que datée et justifiée (`--ignore-vuln`, cf.
  # docs/RELEASE.md), jamais par contournement silencieux.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: pip-audit (requirements.txt, dépendances transitives comprises)
        run: |
          python -m venv /tmp/audit
          # pip du venv à jour : sinon l'audit signale les avis sur pip lui-même,
          # qui n'est pas une dépendance de FontSync.
          /tmp/audit/bin/python -m pip install --quiet --upgrade pip==26.2.2
          /tmp/audit/bin/pip install --quiet pip-audit==2.10.1 -r requirements.txt
          /tmp/audit/bin/pip-audit --strict --progress-spinner off

      - name: npm audit (dépendances de production du frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
