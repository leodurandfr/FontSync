name: CI

# Lint + tests du backend et de l'agent, build typé + tests du frontend.
# Lancé à chaque push et pull request, et appelé par docker-publish.yml avant
# toute publication d'image (M-22) : une image ne part jamais si ce workflow échoue.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dépendances (serveur + outils + agent)
        run: pip install -r requirements-dev.txt -e .

      - name: Lint (ruff)
        run: |
          ruff check backend agent tests
          ruff format --check backend agent tests

      - name: Tests (pytest)
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Build typé (vue-tsc + vite)
        run: npm run build

      - name: Tests (vitest)
        run: npm test
