# Déploiement FontSync sur NAS (Synology Container Manager, QNAP, ou tout hôte
# Docker) — exemple prêt à l'emploi (P2.3, PLAN-PUBLICATION.md).
#
# Un seul conteneur : FastAPI + SQLite (WAL) + storage filesystem. Image
# multi-arch publiée sur ghcr.io (amd64 + arm64) → aucun build local requis.
#
# Démarrage rapide :
#   1. Générer un token :   openssl rand -base64 32
#   2. Le poser dans un fichier .env à côté de ce compose :
#        FONTSYNC_TOKEN=le-token-généré
#   3. docker compose -f docker-compose.nas.yml up -d
#
# ⚠️  HTTP en clair : à réserver au LAN, ou à placer derrière un reverse-proxy
#     TLS (cf. README, section « Transport & sécurité réseau »).
# 📖  Guide pas-à-pas + stratégie de backup : docs/INSTALL-NAS.md

services:
  fontsync:
    image: ghcr.io/leodurandfr/fontsync:latest
    container_name: fontsync
    restart: unless-stopped
    ports:
      - "8080:8000"          # hôte:conteneur — ajustez le port hôte si occupé
    environment:
      # Secret d'instance protégeant tout /api/*, SSE et WS. Obligatoire ici :
      # le compose refuse de démarrer s'il n'est pas défini (voir .env).
      FONTSYNC_TOKEN: ${FONTSYNC_TOKEN:?Définissez FONTSYNC_TOKEN (ex. dans un fichier .env)}
      DATABASE_URL: sqlite+aiosqlite:////data/fontsync.db
      STORAGE_BACKEND: filesystem
      FONT_STORAGE_PATH: /fonts
      # Mise à jour depuis l'interface (Réglages → Serveur). FontSync ne monte
      # pas le socket Docker : il demande le travail à Watchtower ci-dessous,
      # sur le réseau interne du compose. Retirez ces deux lignes (et le service
      # watchtower) pour un déploiement où la mise à jour reste manuelle : le
      # bouton disparaît alors de l'interface.
      WATCHTOWER_URL: http://watchtower:8080
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
      # Sauvegarde automatique : instantané quotidien de la base + miroir
      # hebdomadaire des polices, écrits dans le volume `backups` ci-dessous.
      # Vide → désactivée ; ce compose l'active par défaut. Détail : §5 de
      # docs/INSTALL-NAS.md.
      BACKUP_DIR: /backups
    labels:
      # Watchtower tourne en `--label-enable` : il ne surveille que ce qui porte
      # ce label. Installer FontSync ne fait donc pas de lui le gestionnaire de
      # tout ce qui tourne sur le NAS. (Le label est déjà dans l'image ; on le
      # répète ici pour que ce soit lisible sans inspecter l'image.)
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - db:/data             # base SQLite : fontsync.db (+ -wal, -shm)
      - fonts:/fonts         # fichiers de polices stockés
      - backups:/backups     # sauvegarde automatique (instantanés + miroir)
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Metteur à jour. C'est le seul conteneur à monter le socket Docker : donner
  # ce privilège à FontSync reviendrait à donner l'équivalent du root sur le NAS
  # à une application protégée par un simple token partagé.
  #
  # `--http-api-update` sans `--http-api-periodic-polls` : Watchtower ne fait
  # **rien** de lui-même, il attend qu'on le lui demande. Rien ne se met à jour
  # dans votre dos, et le NAS n'interroge pas ghcr en permanence.
  #
  # Facultatif : supprimez ce service si vous préférez mettre à jour à la main
  # (`docker compose pull && docker compose up -d`). Le bouton disparaît alors
  # de l'interface, qui continue d'afficher la version installée.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: fontsync-watchtower
    restart: unless-stopped
    environment:
      # Même secret que WATCHTOWER_TOKEN côté fontsync (fichier .env).
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:?Définissez WATCHTOWER_TOKEN (ex. dans le fichier .env)}
    command:
      - --http-api-update      # n'agit que sur demande HTTP
      - --label-enable         # et seulement sur les conteneurs étiquetés
      - --cleanup              # retire l'ancienne image après remplacement
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Aucun port publié : l'API n'est joignable que depuis le réseau du compose,
    # donc depuis FontSync — jamais depuis le LAN.

volumes:
  db:
  fonts:
  backups:
